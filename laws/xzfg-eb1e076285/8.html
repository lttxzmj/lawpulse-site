<h1>娱乐场所管理条例 第八条</h1>
<div class="meta"><a href="../xzfg-eb1e076285.html">《娱乐场所管理条例》全文</a> · 第二章设立 · 第8条 · 现行有效</div>
<p>娱乐场所的使用面积，不得低于国务院文化主管部门规定的最低标准；设立含有电子游戏机的游艺娱乐场所，应当符合国务院文化主管部门关于总量和布局的要求。</p>
