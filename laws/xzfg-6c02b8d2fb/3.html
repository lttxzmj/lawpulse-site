<h1>中华人民共和国价格管理条例 第三条</h1>
<div class="meta"><a href="../xzfg-6c02b8d2fb.html">《中华人民共和国价格管理条例》全文</a> · 第一章总则 · 第3条 · 现行有效</div>
<p>国家对价格管理采取直接管理和间接控制相结合的原则，实行国家定价、国家指导价和市场调节价三种价格形式。</p>
