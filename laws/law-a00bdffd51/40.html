<h1>中华人民共和国农业法 第四十条</h1>
<div class="meta"><a href="../law-a00bdffd51.html">《中华人民共和国农业法》全文</a> · 第五章粮食安全 · 第40条 · pending</div>
<p>国家健全粮食生产者收益保障机制，完善价格、补贴、保险等政策体系，完善农业生产资料保供稳价应对机制，保护粮食生产者的种粮积极性。</p>
