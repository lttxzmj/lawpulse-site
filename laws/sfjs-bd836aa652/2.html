<h1>人民法院在线调解规则 第二条</h1>
<div class="meta"><a href="../sfjs-bd836aa652.html">《人民法院在线调解规则》全文</a> · 第2条 · 现行有效</div>
<p>在线调解包括人民法院、当事人、调解组织或者调解员通过人民法院调解平台开展的在线申请、委派委托、音视频调解、制作调解协议、申请司法确认调解协议、制作调解书等全部或者部分调解活动。</p>
