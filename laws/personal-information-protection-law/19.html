<h1>中华人民共和国个人信息保护法 第十九条</h1>
<div class="meta"><a href="../personal-information-protection-law.html">《中华人民共和国个人信息保护法》全文</a> · 第二章个人信息处理规则 · 第一节一般规定 · 第19条 · 现行有效</div>
