<h1>中华人民共和国政府采购法 第三十五条</h1>
<div class="meta"><a href="../law-9db26a8a65.html">《中华人民共和国政府采购法》全文</a> · 第四章政府采购程序 · 第35条 · 现行有效</div>
<p>货物和服务项目实行招标方式采购的，自招标文件开始发出之日起至投标人提交投标文件截止之日止，不得少于二十日。</p>
