<h1>中华人民共和国计量法实施细则 第二十九条</h1>
<div class="meta"><a href="../xzfg-e6dcd7c1d5.html">《中华人民共和国计量法实施细则》全文</a> · 第七章产品质量检验机构的计量认证 · 第29条 · 现行有效</div>
<p>为社会提供公证数据的产品质量检验机构，必须经省级以上人民政府计量行政部门计量认证。</p>
