<h1>中华人民共和国护照法 第二十二条</h1>
<div class="meta"><a href="../law-34727b030f.html">《中华人民共和国护照法》全文</a> · 第22条 · 现行有效</div>
<p>护照签发机关可以收取护照的工本费、加注费。收取的工本费和加注费上缴国库。</p>
<p>护照工本费和加注费的标准由国务院价格行政部门会同国务院财政部门规定、公布。</p>
