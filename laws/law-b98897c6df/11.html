<h1>中华人民共和国预备役人员法 第十一条</h1>
<div class="meta"><a href="../law-b98897c6df.html">《中华人民共和国预备役人员法》全文</a> · 第二章预备役军衔 · 第11条 · 现行有效</div>
<p>国家实行预备役军衔制度。</p>
<p>预备役军衔是区分预备役人员等级、表明预备役人员身份的称号和标志，是党和国家给予预备役人员的地位和荣誉。</p>
