<h1>中华人民共和国国务院组织法 第十七条</h1>
<div class="meta"><a href="../law-d95503e396.html">《中华人民共和国国务院组织法》全文</a> · 第17条 · 现行有效</div>
<p>国务院健全行政监督制度，加强行政复议、备案审查、行政执法监督、政府督查等工作，坚持政务公开，自觉接受各方面监督，强化对行政权力运行的制约和监督。</p>
