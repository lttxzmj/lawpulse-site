<h1>规划环境影响评价条例 第二十九条</h1>
<div class="meta"><a href="../xzfg-d03f50b990.html">《规划环境影响评价条例》全文</a> · 第四章跟踪评价 · 第29条 · 现行有效</div>
<p>规划审批机关在接到规划编制机关的报告或者环境保护主管部门的建议后，应当及时组织论证，并根据论证结果采取改进措施或者对规划进行修订。</p>
