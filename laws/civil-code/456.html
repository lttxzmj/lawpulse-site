<h1>中华人民共和国民法典 第四百五十六条</h1>
<div class="meta"><a href="../civil-code.html">《中华人民共和国民法典》全文</a> · 第二编物权 · 第四分编担保物权 · 第十九章留置权 · 第456条 · 现行有效</div>
