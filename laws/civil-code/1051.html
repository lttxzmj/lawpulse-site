<h1>中华人民共和国民法典 第一千零五十一条</h1>
<div class="meta"><a href="../civil-code.html">《中华人民共和国民法典》全文</a> · 第五编婚姻家庭 · 第二章结婚 · 第1051条 · 现行有效</div>
<p>有下列情形之一的，婚姻无效：</p>
<p>（一）重婚；</p>
<p>（二）有禁止结婚的亲属关系；</p>
<p>（三）未到法定婚龄。</p>
