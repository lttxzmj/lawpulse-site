<h1>拘留所条例 第二十五条</h1>
<div class="meta"><a href="../xzfg-d4b8effc3c.html">《拘留所条例》全文</a> · 第四章管理教育 · 第25条 · 现行有效</div>
<p>拘留所保障被拘留人在拘留期间的通信权利，被拘留人与他人的来往信件不受检查和扣押。被拘留人应当遵守拘留所的通信管理规定。</p>
