<h1>中华人民共和国突发事件应对法 第九十三条</h1>
<div class="meta"><a href="../law-a1a798e9ae.html">《中华人民共和国突发事件应对法》全文</a> · 第六章事后恢复与重建 · 第93条 · 现行有效</div>
<p>突发事件应对工作中有关资金、物资的筹集、管理、分配、拨付和使用等情况，应当依法接受审计机关的审计监督。</p>
