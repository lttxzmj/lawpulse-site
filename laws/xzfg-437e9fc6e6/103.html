<h1>铁路安全管理条例 第一百零三条</h1>
<div class="meta"><a href="../xzfg-437e9fc6e6.html">《铁路安全管理条例》全文</a> · 第七章法律责任 · 第103条 · 现行有效</div>
<p>从事铁路建设、运输、设备制造维修的单位违反本条例规定，对直接负责的主管人员和其他直接责任人员依法给予处分。</p>
