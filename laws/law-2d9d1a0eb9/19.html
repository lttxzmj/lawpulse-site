<h1>中华人民共和国戒严法 第十九条</h1>
<div class="meta"><a href="../law-2d9d1a0eb9.html">《中华人民共和国戒严法》全文</a> · 第三章实施戒严的措施 · 第19条 · 现行有效</div>
<p>为保障戒严地区内的人民基本生活必需品的供应，戒严实施机关可以对基本生活必需品的生产、运输、供应、价格，采取特别管理措施。</p>
