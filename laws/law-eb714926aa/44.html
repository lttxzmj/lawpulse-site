<h1>中华人民共和国测绘法 第四十四条</h1>
<div class="meta"><a href="../law-eb714926aa.html">《中华人民共和国测绘法》全文</a> · 第七章测量标志保护 · 第44条 · 现行有效</div>
<p>测绘人员使用永久性测量标志，应当持有测绘作业证件，并保证测量标志的完好。</p>
<p>保管测量标志的人员应当查验测量标志使用后的完好状况。</p>
