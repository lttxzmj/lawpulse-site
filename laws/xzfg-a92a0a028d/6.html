<h1>水产资源繁殖保护条例 第六条</h1>
<div class="meta"><a href="../xzfg-a92a0a028d.html">《水产资源繁殖保护条例》全文</a> · 第二章保护对象和采捕原则 · 第6条 · 现行有效</div>
<p>各地应当因地制宜采取各种措施，如改良水域条件、人工投放苗种、投放鱼巢、灌江纳苗、营救幼鱼、移植驯化、消除敌害、引种栽植等，增殖水产资源。</p>
