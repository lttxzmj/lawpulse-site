<h1>中华人民共和国公共图书馆法 第五十三条</h1>
<div class="meta"><a href="../law-4625e957f3.html">《中华人民共和国公共图书馆法》全文</a> · 第五章法律责任 · 第53条 · 现行有效</div>
<p>损坏公共图书馆的文献信息、设施设备或者未按照规定时限归还所借文献信息，造成财产损失或者其他损害的，依法承担民事责任。</p>
