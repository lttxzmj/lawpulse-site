<h1>中华人民共和国监察法 第七条</h1>
<div class="meta"><a href="../law-4a9aed9831.html">《中华人民共和国监察法》全文</a> · 第二章监察机关及其职责 · 第7条 · 现行有效</div>
<p>中华人民共和国国家监察委员会是最高监察机关。</p>
<p>省、自治区、直辖市、自治州、县、自治县、市、市辖区设立监察委员会。</p>
