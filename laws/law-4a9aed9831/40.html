<h1>中华人民共和国监察法 第四十条</h1>
<div class="meta"><a href="../law-4a9aed9831.html">《中华人民共和国监察法》全文</a> · 第五章监察程序 · 第40条 · 现行有效</div>
<p>监察机关对监察对象的问题线索，应当按照有关规定提出处置意见，履行审批手续，进行分类办理。线索处置情况应当定期汇总、通报，定期检查、抽查。</p>
