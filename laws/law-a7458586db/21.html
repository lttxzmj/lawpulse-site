<h1>中华人民共和国就业促进法 第二十一条</h1>
<div class="meta"><a href="../law-a7458586db.html">《中华人民共和国就业促进法》全文</a> · 第二章政策支持 · 第21条 · 现行有效</div>
<p>国家支持区域经济发展，鼓励区域协作，统筹协调不同地区就业的均衡增长。</p>
<p>国家支持民族地区发展经济，扩大就业。</p>
