<h1>中华人民共和国车船税法 第一条</h1>
<div class="meta"><a href="../law-86a496b2cc.html">《中华人民共和国车船税法》全文</a> · 第1条 · 现行有效</div>
<p>在中华人民共和国境内属于本法所附《车船税税目税额表》规定的车辆、船舶（以下简称车船）的所有人或者管理人，为车船税的纳税人，应当依照本法缴纳车船税。</p>
