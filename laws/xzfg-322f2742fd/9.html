<h1>中华人民共和国渔业法实施细则 第九条</h1>
<div class="meta"><a href="../xzfg-322f2742fd.html">《中华人民共和国渔业法实施细则》全文</a> · 第二章渔业的监督管理 · 第9条 · 现行有效</div>
<p>群众性护渔管理组织，应当在当地县级以上人民政府渔业行政主管部门的业务指导下，依法开展护渔管理工作。</p>
