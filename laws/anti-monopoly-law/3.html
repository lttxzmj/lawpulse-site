<h1>中华人民共和国反垄断法 第三条</h1>
<div class="meta"><a href="../anti-monopoly-law.html">《中华人民共和国反垄断法》全文</a> · 第一章总则 · 第3条 · 现行有效</div>
<p>本法规定的垄断行为包括：</p>
<p>（一）经营者达成垄断协议；</p>
<p>（二）经营者滥用市场支配地位；</p>
<p>（三）具有或者可能具有排除、限制竞争效果的经营者集中。</p>
