<h1>中华人民共和国家庭教育促进法 第四十二条</h1>
<div class="meta"><a href="../family-education-promotion-law.html">《中华人民共和国家庭教育促进法》全文</a> · 第四章社会协同 · 第42条 · 现行有效</div>
<p>具备条件的中小学校、幼儿园应当在教育行政部门的指导下，为家庭教育指导服务站点开展公益性家庭教育指导服务活动提供支持。</p>
