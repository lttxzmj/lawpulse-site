<h1>村庄和集镇规划建设管理条例 第四十五条</h1>
<div class="meta"><a href="../xzfg-79f99d6fd9.html">《村庄和集镇规划建设管理条例》全文</a> · 第七章附则 · 第45条 · 现行有效</div>
<p>未设镇建制的国营农场场部、国营林场场部及其基层居民点的规划建设管理，分别由国营农场、国营林场主管部门负责，参照本条例执行。</p>
