<h1>总会计师条例 第八条</h1>
<div class="meta"><a href="../xzfg-4101419ec9.html">《总会计师条例》全文</a> · 第二章总会计师的职责 · 第8条 · 现行有效</div>
<p>总会计师负责对本单位财会机构的设置和会计人员的配备、会计专业职务的设置和聘任提出方案；组织会计人员的业务培训和考核；支持会计人员依法行使职权。</p>
