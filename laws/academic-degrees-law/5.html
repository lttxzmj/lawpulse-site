<h1>中华人民共和国学位法 第五条</h1>
<div class="meta"><a href="../academic-degrees-law.html">《中华人民共和国学位法》全文</a> · 第一章总则 · 第5条 · 现行有效</div>
<p>经审批取得相应学科、专业学位授予资格的高等学校、科学研究机构为学位授予单位，其授予学位的学科、专业为学位授予点。学位授予单位可以依照本法规定授予相应学位。</p>
