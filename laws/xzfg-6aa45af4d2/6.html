<h1>存款保险条例 第六条</h1>
<div class="meta"><a href="../xzfg-6aa45af4d2.html">《存款保险条例》全文</a> · 第6条 · 现行有效</div>
<p>存款保险基金的来源包括：</p>
<p>(一)投保机构交纳的保费；</p>
<p>(二)在投保机构清算中分配的财产；</p>
<p>(三)存款保险基金管理机构运用存款保险基金获得的收益；</p>
<p>(四)其他合法收入。</p>
