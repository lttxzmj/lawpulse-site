<h1>中华人民共和国外国国家豁免法 第十三条</h1>
<div class="meta"><a href="../law-dded1f7d3a.html">《中华人民共和国外国国家豁免法》全文</a> · 第13条 · 现行有效</div>
<p>外国国家的财产在中华人民共和国的法院享有司法强制措施豁免。</p>
<p>外国国家接受中华人民共和国的法院管辖，不视为放弃司法强制措施豁免。</p>
