<h1>征兵工作条例 第六十五条</h1>
<div class="meta"><a href="../xzfg-6cb6b55884.html">《征兵工作条例》全文</a> · 第九章战时征集 · 第65条 · 现行有效</div>
<p>国防部征兵办公室根据战时兵员补充需求，指导县级以上地方人民政府征兵办公室按照战时征集的条件和办法组织实施征集工作。</p>
