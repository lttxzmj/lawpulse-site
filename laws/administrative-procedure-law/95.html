<h1>中华人民共和国行政诉讼法 第九十五条</h1>
<div class="meta"><a href="../administrative-procedure-law.html">《中华人民共和国行政诉讼法》全文</a> · 第八章执行 · 第95条 · 现行有效</div>
<p>公民、法人或者其他组织拒绝履行判决、裁定、调解书的，行政机关或者第三人可以向第一审人民法院申请强制执行，或者由行政机关依法强制执行。</p>
