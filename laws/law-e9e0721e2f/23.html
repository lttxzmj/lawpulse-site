<h1>中华人民共和国境外非政府组织境内活动管理法 第二十三条</h1>
<div class="meta"><a href="../law-e9e0721e2f.html">《中华人民共和国境外非政府组织境内活动管理法》全文</a> · 第三章活动规范 · 第23条 · 现行有效</div>
<p>境外非政府组织应当按照代表机构登记的业务范围、活动地域或者与中方合作单位协议的约定使用资金。</p>
