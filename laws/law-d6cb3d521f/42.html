<h1>中华人民共和国残疾人保障法 第四十二条</h1>
<div class="meta"><a href="../law-d6cb3d521f.html">《中华人民共和国残疾人保障法》全文</a> · 第五章文化生活 · 第42条 · 现行有效</div>
<p>残疾人文化、体育、娱乐活动应当面向基层，融于社会公共文化生活，适应各类残疾人的不同特点和需要，使残疾人广泛参与。</p>
