<h1>反分裂国家法 第一条</h1>
<div class="meta"><a href="../law-ad55cb0044.html">《反分裂国家法》全文</a> · 第1条 · 现行有效</div>
<p>为了反对和遏制“台独”分裂势力分裂国家，促进祖国和平统一，维护台湾海峡地区和平稳定，维护国家主权和领土完整，维护中华民族的根本利益，根据宪法，制定本法。</p>
