<h1>中华人民共和国人民警察法 第四十三条</h1>
<div class="meta"><a href="../peoples-police-law.html">《中华人民共和国人民警察法》全文</a> · 第六章执法监督 · 第43条 · 现行有效</div>
<p>人民警察的上级机关对下级机关的执法活动进行监督，发现其作出的处理或者决定有错误的，应当予以撤销或者变更。</p>
