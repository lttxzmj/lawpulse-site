<h1>中华人民共和国期货和衍生品法 第八十六条</h1>
<div class="meta"><a href="../law-c025646800.html">《中华人民共和国期货和衍生品法》全文</a> · 第六章期货交易场所 · 第86条 · 现行有效</div>
<p>期货交易所的所得收益按照国家有关规定管理和使用，应当首先用于保证期货交易的场所、设施的运行和改善。</p>
