<h1>中华人民共和国拍卖法 第十一条</h1>
<div class="meta"><a href="../law-ac3423e04f.html">《中华人民共和国拍卖法》全文</a> · 第三章拍卖当事人 · 第一节拍卖人 · 第11条 · 现行有效</div>
<p>企业取得从事拍卖业务的许可必须经所在地的省、自治区、直辖市人民政府负责管理拍卖业的部门审核批准。拍卖企业可以在设区的市设立。</p>
