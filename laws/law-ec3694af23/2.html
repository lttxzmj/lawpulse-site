<h1>中华人民共和国计量法 第二条</h1>
<div class="meta"><a href="../law-ec3694af23.html">《中华人民共和国计量法》全文</a> · 第一章总则 · 第2条 · 现行有效</div>
<p>在中华人民共和国境内，建立计量基准器具、计量标准器具，进行计量检定，制造、修理、销售、使用计量器具，必须遵守本法。</p>
