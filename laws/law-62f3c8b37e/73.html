<h1>中华人民共和国畜牧法 第七十三条</h1>
<div class="meta"><a href="../law-62f3c8b37e.html">《中华人民共和国畜牧法》全文</a> · 第八章保障与监督 · 第73条 · 现行有效</div>
<p>县级以上人民政府农业农村主管部门应当制定畜禽质量安全监督抽查计划，并按照计划开展监督抽查工作。</p>
