<h1>中华人民共和国疫苗管理法 第九十八条</h1>
<div class="meta"><a href="../law-ee83238794.html">《中华人民共和国疫苗管理法》全文</a> · 第十一章附则 · 第98条 · 现行有效</div>
<p>国家鼓励疫苗生产企业按照国际采购要求生产、出口疫苗。</p>
<p>出口的疫苗应当符合进口国（地区）的标准或者合同要求。</p>
