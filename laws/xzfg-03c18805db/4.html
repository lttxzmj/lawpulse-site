<h1>安全生产许可证条例 第四条</h1>
<div class="meta"><a href="../xzfg-03c18805db.html">《安全生产许可证条例》全文</a> · 第4条 · 现行有效</div>
<p>省、自治区、直辖市人民政府建设主管部门负责建筑施工企业安全生产许可证的颁发和管理，并接受国务院建设主管部门的指导和监督。</p>
