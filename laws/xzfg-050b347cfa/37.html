<h1>彩票管理条例 第三十七条</h1>
<div class="meta"><a href="../xzfg-050b347cfa.html">《彩票管理条例》全文</a> · 第四章彩票资金管理 · 第37条 · 现行有效</div>
<p>国务院财政部门和省、自治区、直辖市人民政府财政部门应当每年向本级人民政府报告上年度彩票公益金的筹集、分配和使用情况，并向社会公告。</p>
