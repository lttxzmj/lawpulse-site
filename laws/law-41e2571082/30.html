<h1>中华人民共和国国防教育法 第三十条</h1>
<div class="meta"><a href="../law-41e2571082.html">《中华人民共和国国防教育法》全文</a> · 第四章国防教育保障 · 第30条 · 现行有效</div>
<p>国防教育经费和企业事业组织、社会组织、个人资助国防教育的财产，必须用于国防教育事业，任何单位或者个人不得侵占、挪用、克扣。</p>
