<h1>中华人民共和国体育法 第四十四条</h1>
<div class="meta"><a href="../sports-law.html">《中华人民共和国体育法》全文</a> · 第四章竞技体育 · 第44条 · 现行有效</div>
<p>国家依法保障运动员接受文化教育的权利。</p>
<p>体育行政部门、教育行政部门应当保障处于义务教育阶段的运动员完成义务教育。</p>
