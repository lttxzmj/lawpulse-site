<h1>中华人民共和国体育法 第八十九条</h1>
<div class="meta"><a href="../sports-law.html">《中华人民共和国体育法》全文</a> · 第八章保障条件 · 第89条 · 现行有效</div>
<p>国家发展体育专业教育，鼓励有条件的高等学校培养教练员、裁判员、体育教师等各类体育专业人才，鼓励社会力量依法开展体育专业教育。</p>
