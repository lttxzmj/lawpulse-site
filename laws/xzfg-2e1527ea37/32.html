<h1>煤矿安全生产条例 第三十二条</h1>
<div class="meta"><a href="../xzfg-2e1527ea37.html">《煤矿安全生产条例》全文</a> · 第二章煤矿企业的安全生产责任 · 第32条 · 现行有效</div>
<p>煤矿企业应当按照煤矿灾害程度和类型实施灾害治理，编制年度灾害预防和处理计划，并根据具体情况及时修改。</p>
