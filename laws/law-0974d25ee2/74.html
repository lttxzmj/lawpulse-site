<h1>中华人民共和国预算法 第七十四条</h1>
<div class="meta"><a href="../law-0974d25ee2.html">《中华人民共和国预算法》全文</a> · 第八章决算 · 第74条 · 现行有效</div>
<p>决算草案由各级政府、各部门、各单位，在每一预算年度终了后按照国务院规定的时间编制。</p>
<p>编制决算草案的具体事项，由国务院财政部门部署。</p>
