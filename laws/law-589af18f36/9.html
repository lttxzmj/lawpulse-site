<h1>中华人民共和国监狱法 第九条</h1>
<div class="meta"><a href="../law-589af18f36.html">《中华人民共和国监狱法》全文</a> · 第一章总则 · 第9条 · 现行有效</div>
<p>监狱依法使用的土地、矿产资源和其他自然资源以及监狱的财产，受法律保护，任何组织或者个人不得侵占、破坏。</p>
