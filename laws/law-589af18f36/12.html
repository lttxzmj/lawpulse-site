<h1>中华人民共和国监狱法 第十二条</h1>
<div class="meta"><a href="../law-589af18f36.html">《中华人民共和国监狱法》全文</a> · 第二章监狱 · 第12条 · 现行有效</div>
<p>监狱设监狱长一人、副监狱长若干人，并根据实际需要设置必要的工作机构和配备其他监狱管理人员。</p>
<p>监狱的管理人员是人民警察。</p>
