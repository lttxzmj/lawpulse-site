<h1>中华人民共和国气象法 第四条</h1>
<div class="meta"><a href="../law-5cc255e0b2.html">《中华人民共和国气象法》全文</a> · 第一章总则 · 第4条 · 现行有效</div>
<p>县、市气象主管机构所属的气象台站应当主要为农业生产服务，及时主动提供保障当地农业生产所需的公益性气象信息服务。</p>
