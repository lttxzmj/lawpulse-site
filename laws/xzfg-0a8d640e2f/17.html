<h1>中国公民出国旅游管理办法 第十七条</h1>
<div class="meta"><a href="../xzfg-0a8d640e2f.html">《中国公民出国旅游管理办法》全文</a> · 第17条 · 现行有效</div>
<p>旅游团队领队应当向旅游者介绍旅游目的地国家的相关法律、风俗习惯以及其他有关注意事项，并尊重旅游者的人格尊严、宗教信仰、民族风俗和生活习惯。</p>
