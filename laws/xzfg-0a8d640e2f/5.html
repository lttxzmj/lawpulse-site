<h1>中国公民出国旅游管理办法 第五条</h1>
<div class="meta"><a href="../xzfg-0a8d640e2f.html">《中国公民出国旅游管理办法》全文</a> · 第5条 · 现行有效</div>
<p>国务院旅游行政部门应当将取得出国旅游业务经营资格的旅行社(以下简称组团社)名单予以公布，并通报国务院有关部门。</p>
