<h1>中华人民共和国行政复议法 第十八条</h1>
<div class="meta"><a href="../administrative-reconsideration-law.html">《中华人民共和国行政复议法》全文</a> · 第二章行政复议申请 · 第二节行政复议参加人 · 第18条 · 现行有效</div>
<p>符合法律援助条件的行政复议申请人申请法律援助的，法律援助机构应当依法为其提供法律援助。</p>
