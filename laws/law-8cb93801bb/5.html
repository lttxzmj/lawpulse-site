<h1>中华人民共和国人民武装警察法 第五条</h1>
<div class="meta"><a href="../law-8cb93801bb.html">《中华人民共和国人民武装警察法》全文</a> · 第一章总则 · 第5条 · 现行有效</div>
<p>人民武装警察部队应当遵守宪法和法律，忠于职守，依照本法和其他法律的有关规定履行职责。</p>
<p>人民武装警察部队依法履行职责的行为受法律保护。</p>
