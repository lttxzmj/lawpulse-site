<h1>中华人民共和国票据法 第七十三条</h1>
<div class="meta"><a href="../law-89b9e7bc5b.html">《中华人民共和国票据法》全文</a> · 第三章本票 · 第73条 · 现行有效</div>
<p>本票是出票人签发的，承诺自己在见票时无条件支付确定的金额给收款人或者持票人的票据。</p>
<p>本法所称本票，是指银行本票。</p>
