<h1>中华人民共和国票据法 第一百零七条</h1>
<div class="meta"><a href="../law-89b9e7bc5b.html">《中华人民共和国票据法》全文</a> · 第七章附则 · 第107条 · 现行有效</div>
<p>本法规定的各项期限的计算，适用民法通则关于计算期间的规定。</p>
<p>按月计算期限的，按到期月的对日计算；无对日的，月末日为到期日。</p>
