<h1>中华人民共和国票据法 第八十一条</h1>
<div class="meta"><a href="../law-89b9e7bc5b.html">《中华人民共和国票据法》全文</a> · 第四章支票 · 第81条 · 现行有效</div>
<p>支票是出票人签发的，委托办理支票存款业务的银行或者其他金融机构在见票时无条件支付确定的金额给收款人或者持票人的票据。</p>
