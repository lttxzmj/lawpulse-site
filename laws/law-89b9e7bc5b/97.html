<h1>中华人民共和国票据法 第九十七条</h1>
<div class="meta"><a href="../law-89b9e7bc5b.html">《中华人民共和国票据法》全文</a> · 第五章涉外票据的法律适用 · 第97条 · 现行有效</div>
<p>汇票、本票出票时的记载事项，适用出票地法律。</p>
<p>支票出票时的记载事项，适用出票地法律，经当事人协议，也可以适用付款地法律。</p>
