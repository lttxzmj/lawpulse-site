<h1>中华人民共和国票据法 第十八条</h1>
<div class="meta"><a href="../law-89b9e7bc5b.html">《中华人民共和国票据法》全文</a> · 第一章总则 · 第18条 · 现行有效</div>
<p>持票人因超过票据权利时效或者因票据记载事项欠缺而丧失票据权利的，仍享有民事权利，可以请求出票人或者承兑人返还其与未支付的票据金额相当的利益。</p>
