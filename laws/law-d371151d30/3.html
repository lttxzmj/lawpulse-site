<h1>中华人民共和国水法 第三条</h1>
<div class="meta"><a href="../law-d371151d30.html">《中华人民共和国水法》全文</a> · 第一章总则 · 第3条 · 现行有效</div>
<p>水资源属于国家所有。水资源的所有权由国务院代表国家行使。农村集体经济组织的水塘和由农村集体经济组织修建管理的水库中的水，归各该农村集体经济组织使用。</p>
