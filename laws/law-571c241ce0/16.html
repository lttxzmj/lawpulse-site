<h1>中华人民共和国红十字会法 第十六条</h1>
<div class="meta"><a href="../law-571c241ce0.html">《中华人民共和国红十字会法》全文</a> · 第四章标志与名称 · 第16条 · 现行有效</div>
<p>红十字标志和名称受法律保护。禁止利用红十字标志和名称牟利，禁止以任何形式冒用、滥用、篡改红十字标志和名称。</p>
