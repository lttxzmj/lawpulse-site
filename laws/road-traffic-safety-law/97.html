<h1>中华人民共和国道路交通安全法 第九十七条</h1>
<div class="meta"><a href="../road-traffic-safety-law.html">《中华人民共和国道路交通安全法》全文</a> · 第七章法律责任 · 第97条 · 现行有效</div>
<p>非法安装警报器、标志灯具的，由公安机关交通管理部门强制拆除，予以收缴，并处二百元以上二千元以下罚款。</p>
