<h1>金融违法行为处罚办法 第四条</h1>
<div class="meta"><a href="../xzfg-08c19b4feb.html">《金融违法行为处罚办法》全文</a> · 第4条 · 现行有效</div>
<p>金融机构的工作人员离开该金融机构工作后，被发现在该金融机构工作期间违反国家有关金融管理规定的，仍然应当依法追究责任。</p>
