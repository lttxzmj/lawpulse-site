<h1>核电厂核事故应急管理条例 第二十五条</h1>
<div class="meta"><a href="../xzfg-ef81113144.html">《核电厂核事故应急管理条例》全文</a> · 第四章应急对策和应急防护措施 · 第25条 · 现行有效</div>
<p>核电厂的核事故应急机构和省级人民政府指定的部门应当做好核事故现场接受照射人员的救护、洗消、转运和医学处置工作。</p>
