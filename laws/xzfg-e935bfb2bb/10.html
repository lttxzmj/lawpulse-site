<h1>票据管理实施办法 第十条</h1>
<div class="meta"><a href="../xzfg-e935bfb2bb.html">《票据管理实施办法》全文</a> · 第10条 · 现行有效</div>
<p>向银行申请办理票据贴现的商业汇票的持票人，必须具备下列条件：</p>
<p>(一)在银行开立存款账户；</p>
<p>(二)与出票人、前手之间具有真实的交易关系和债权债务关系。</p>
