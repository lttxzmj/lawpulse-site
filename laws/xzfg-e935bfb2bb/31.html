<h1>票据管理实施办法 第三十一条</h1>
<div class="meta"><a href="../xzfg-e935bfb2bb.html">《票据管理实施办法》全文</a> · 第31条 · 现行有效</div>
<p>签发空头支票或者签发与其预留的签章不符的支票，不以骗取财物为目的的，由中国人民银行处以票面金额5%但不低于1000元的罚款；持票人有权要求出票人赔偿支票金额2%的赔偿金。</p>
