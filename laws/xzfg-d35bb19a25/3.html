<h1>防范和处置非法集资条例 第三条</h1>
<div class="meta"><a href="../xzfg-d35bb19a25.html">《防范和处置非法集资条例》全文</a> · 第一章总则 · 第3条 · 现行有效</div>
<p>本条例所称非法集资人，是指发起、主导或者组织实施非法集资的单位和个人；所称非法集资协助人，是指明知是非法集资而为其提供帮助并获取经济利益的单位和个人。</p>
