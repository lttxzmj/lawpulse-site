<h1>中华人民共和国土壤污染防治法 第八十三条</h1>
<div class="meta"><a href="../law-d23d7d5023.html">《中华人民共和国土壤污染防治法》全文</a> · 第五章保障和监督 · 第83条 · 现行有效</div>
