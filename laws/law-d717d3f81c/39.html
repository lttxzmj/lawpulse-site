<h1>中华人民共和国国家公园法 第三十九条</h1>
<div class="meta"><a href="../law-d717d3f81c.html">《中华人民共和国国家公园法》全文</a> · 第四章参与和共享 · 第39条 · 现行有效</div>
<p>对划入国家公园区域内的集体所有土地及其附属资源，应当依法维护权利人的权益，引导相关利益主体通过多元化方式参与国家公园建设和保护。</p>
