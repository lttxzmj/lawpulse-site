<h1>中华人民共和国预防未成年人犯罪法 第二十七条</h1>
<div class="meta"><a href="../law-cf97bb4be6.html">《中华人民共和国预防未成年人犯罪法》全文</a> · 第二章预防犯罪的教育 · 第27条 · 现行有效</div>
<p>职业培训机构、用人单位在对已满十六周岁准备就业的未成年人进行职业培训时，应当将预防犯罪教育纳入培训内容。</p>
