<h1>中华人民共和国预防未成年人犯罪法 第三条</h1>
<div class="meta"><a href="../law-cf97bb4be6.html">《中华人民共和国预防未成年人犯罪法》全文</a> · 第一章总则 · 第3条 · 现行有效</div>
<p>开展预防未成年人犯罪工作，应当尊重未成年人人格尊严，保护未成年人的名誉权、隐私权和个人信息等合法权益。</p>
