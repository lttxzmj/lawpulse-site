<h1>全国经济普查条例 第二十七条</h1>
<div class="meta"><a href="../xzfg-e69a005068.html">《全国经济普查条例》全文</a> · 第五章数据处理和质量控制 · 第27条 · 现行有效</div>
<p>经济普查数据处理结束后，各级经济普查机构应当做好数据备份和数据入库工作，建立健全基本单位名录库及其数据库系统，并强化日常管理和维护更新。</p>
