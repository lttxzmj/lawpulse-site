<h1>全国经济普查条例 第十七条</h1>
<div class="meta"><a href="../xzfg-e69a005068.html">《全国经济普查条例》全文</a> · 第四章经济普查的组织实施 · 第17条 · 现行有效</div>
<p>国务院和地方各级人民政府有关部门设立经济普查机构，负责完成国务院和本级地方人民政府经济普查领导小组办公室指定的经济普查任务。</p>
