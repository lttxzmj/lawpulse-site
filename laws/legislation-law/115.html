<h1>中华人民共和国立法法 第一百一十五条</h1>
<div class="meta"><a href="../legislation-law.html">《中华人民共和国立法法》全文</a> · 第五章适用与备案审查 · 第115条 · 现行有效</div>
<p>备案审查机关应当建立健全备案审查衔接联动机制，对应当由其他机关处理的审查要求或者审查建议，及时移送有关机关处理。</p>
