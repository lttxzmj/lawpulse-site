<h1>中华人民共和国大气污染防治法 第九十条</h1>
<div class="meta"><a href="../law-db3d69f41c.html">《中华人民共和国大气污染防治法》全文</a> · 第五章重点区域大气污染联合防治 · 第90条 · 现行有效</div>
<p>国家大气污染防治重点区域内新建、改建、扩建用煤项目的，应当实行煤炭的等量或者减量替代。</p>
