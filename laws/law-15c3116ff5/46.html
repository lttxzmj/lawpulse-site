<h1>中华人民共和国动物防疫法 第四十六条</h1>
<div class="meta"><a href="../law-15c3116ff5.html">《中华人民共和国动物防疫法》全文</a> · 第四章动物疫病的控制 · 第46条 · 现行有效</div>
<p>发生重大动物疫情时，国务院农业农村主管部门负责划定动物疫病风险区，禁止或者限制特定动物、动物产品由高风险区向低风险区调运。</p>
