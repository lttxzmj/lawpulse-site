<h1>中华人民共和国企业破产法 第二十一条</h1>
<div class="meta"><a href="../enterprise-bankruptcy-law.html">《中华人民共和国企业破产法》全文</a> · 第二章申请和受理 · 第二节受理 · 第21条 · 现行有效</div>
