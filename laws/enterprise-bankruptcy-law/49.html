<h1>中华人民共和国企业破产法 第四十九条</h1>
<div class="meta"><a href="../enterprise-bankruptcy-law.html">《中华人民共和国企业破产法》全文</a> · 第六章债权申报 · 第49条 · 现行有效</div>
<p>债权人申报债权时，应当书面说明债权的数额和有无财产担保，并提交有关证据。申报的债权是连带债权的，应当说明。</p>
