<h1>中华人民共和国爱国主义教育法 第九条</h1>
<div class="meta"><a href="../patriotic-education-law.html">《中华人民共和国爱国主义教育法》全文</a> · 第一章总则 · 第9条 · 现行有效</div>
<p>爱国主义教育应当把弘扬爱国主义精神与扩大对外开放结合起来，坚持理性、包容、开放，尊重各国历史特点和文化传统，借鉴吸收人类一切优秀文明成果。</p>
