<h1>人民检察院公益诉讼办案规则 第三条</h1>
<div class="meta"><a href="../sfjs-b57e260dd0.html">《人民检察院公益诉讼办案规则》全文</a> · 第一章总则 · 第3条 · 现行有效</div>
<p>人民检察院办理公益诉讼案件，应当遵守宪法、法律和相关法规，秉持客观公正立场，遵循相关诉讼制度的基本原则和程序规定，坚持司法公开。</p>
