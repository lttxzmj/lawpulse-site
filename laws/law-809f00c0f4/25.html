<h1>中华人民共和国煤炭法 第二十五条</h1>
<div class="meta"><a href="../law-809f00c0f4.html">《中华人民共和国煤炭法》全文</a> · 第三章煤炭生产与煤矿安全 · 第25条 · 现行有效</div>
<p>因开采煤炭压占土地或者造成地表土地塌陷、挖损，由采矿者负责进行复垦，恢复到可供利用的状态；造成他人损失的，应当依法给予补偿。</p>
