<h1>中华人民共和国煤炭法 第十七条</h1>
<div class="meta"><a href="../law-809f00c0f4.html">《中华人民共和国煤炭法》全文</a> · 第二章煤炭生产开发规划与煤矿建设 · 第17条 · 现行有效</div>
<p>国家制定优惠政策，支持煤炭工业发展，促进煤矿建设。</p>
<p>煤矿建设项目应当符合煤炭生产开发规划和煤炭产业政策。</p>
