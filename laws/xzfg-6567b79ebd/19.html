<h1>农药管理条例 第十九条</h1>
<div class="meta"><a href="../xzfg-6567b79ebd.html">《农药管理条例》全文</a> · 第三章农药生产 · 第19条 · 现行有效</div>
<p>委托加工、分装农药的，委托人应当取得相应的农药登记证，受托人应当取得农药生产许可证。</p>
<p>委托人应当对委托加工、分装的农药质量负责。</p>
