<h1>中华人民共和国献血法 第十一条</h1>
<div class="meta"><a href="../law-40edb05366.html">《中华人民共和国献血法》全文</a> · 第11条 · 现行有效</div>
<p>无偿献血的血液必须用于临床，不得买卖。血站、医疗机构不得将无偿献血的血液出售给单采血浆站或者血液制品生产单位。</p>
