<h1>密云水库水源保护条例 第五条</h1>
<div class="meta"><a href="../xzfg-a8334491c9.html">《密云水库水源保护条例》全文</a> · 第5条 · 现行有效</div>
<p>北京市人民政府、河北省人民政府应当共同制定密云水库水源保护总体方案，明确工作目标、重点任务、保障措施、落实机制等事项。</p>
