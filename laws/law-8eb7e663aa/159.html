<h1>中华人民共和国民用航空法 第一百五十九条</h1>
<div class="meta"><a href="../law-8eb7e663aa.html">《中华人民共和国民用航空法》全文</a> · 第七章通用航空 · 第159条 · 现行有效</div>
<p>通用航空企业从事经营性通用航空活动，应当与用户订立书面合同，但是紧急情况下的应急救援飞行除外。</p>
