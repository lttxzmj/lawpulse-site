<h1>中华人民共和国资产评估法 第十八条</h1>
<div class="meta"><a href="../law-19e7ce90b8.html">《中华人民共和国资产评估法》全文</a> · 第三章评估机构 · 第18条 · 现行有效</div>
<p>委托人拒绝提供或者不如实提供执行评估业务所需的权属证明、财务会计信息和其他资料的，评估机构有权依法拒绝其履行合同的要求。</p>
