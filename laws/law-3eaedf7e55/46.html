<h1>中华人民共和国军人地位和权益保障法 第四十六条</h1>
<div class="meta"><a href="../law-3eaedf7e55.html">《中华人民共和国军人地位和权益保障法》全文</a> · 第五章抚恤优待 · 第46条 · 现行有效</div>
<p>军人家属凭有关部门制发的证件享受法律法规规定的优待保障。具体办法由国务院和中央军事委员会有关部门制定。</p>
