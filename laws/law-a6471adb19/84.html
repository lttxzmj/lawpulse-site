<h1>中华人民共和国学前教育法 第八十四条</h1>
<div class="meta"><a href="../law-a6471adb19.html">《中华人民共和国学前教育法》全文</a> · 第九章附则 · 第84条 · 现行有效</div>
<p>鼓励有条件的幼儿园开设托班，提供托育服务。</p>
