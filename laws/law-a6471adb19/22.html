<h1>中华人民共和国学前教育法 第二十二条</h1>
<div class="meta"><a href="../law-a6471adb19.html">《中华人民共和国学前教育法》全文</a> · 第三章幼儿园 · 第22条 · 现行有效</div>
<p>县级以上地方人民政府应当统筹当前和长远，根据人口变化和城镇化发展趋势，科学规划和配置学前教育资源，有效满足需求，避免浪费资源。</p>
