<h1>中华人民共和国禁毒法 第六十七条</h1>
<div class="meta"><a href="../law-1a2ce25817.html">《中华人民共和国禁毒法》全文</a> · 第六章法律责任 · 第67条 · 现行有效</div>
<p>戒毒医疗机构发现接受戒毒治疗的戒毒人员在治疗期间吸食、注射毒品，不向公安机关报告的，由卫生行政部门责令改正；情节严重的，责令停业整顿。</p>
