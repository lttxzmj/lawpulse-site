<h1>中华人民共和国禁毒法 第十七条</h1>
<div class="meta"><a href="../law-1a2ce25817.html">《中华人民共和国禁毒法》全文</a> · 第二章禁毒宣传教育 · 第17条 · 现行有效</div>
