<h1>中华人民共和国石油天然气管道保护法 第三条</h1>
<div class="meta"><a href="../law-0316cb73fd.html">《中华人民共和国石油天然气管道保护法》全文</a> · 第一章总则 · 第3条 · 现行有效</div>
<p>本法所称石油包括原油和成品油，所称天然气包括天然气、煤层气和煤制气。</p>
<p>本法所称管道包括管道及管道附属设施。</p>
