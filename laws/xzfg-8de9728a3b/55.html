<h1>社会救助暂行办法 第五十五条</h1>
<div class="meta"><a href="../xzfg-8de9728a3b.html">《社会救助暂行办法》全文</a> · 第十章社会力量参与 · 第55条 · 现行有效</div>
<p>县级以上地方人民政府应当发挥社会工作服务机构和社会工作者作用，为社会救助对象提供社会融入、能力提升、心理疏导等专业服务。</p>
