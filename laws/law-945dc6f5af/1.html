<h1>中华人民共和国领事特权与豁免条例 第一条</h1>
<div class="meta"><a href="../law-945dc6f5af.html">《中华人民共和国领事特权与豁免条例》全文</a> · 第1条 · 现行有效</div>
<p>为确定外国驻中国领馆和领馆成员的领事特权与豁免，便于外国驻中国领馆在领区内代表其国家有效地执行职务，制定本条例。</p>
