<h1>中华人民共和国慈善法 第二十一条</h1>
<div class="meta"><a href="../law-3cfabcd7ed.html">《中华人民共和国慈善法》全文</a> · 第三章慈善募捐 · 第21条 · 现行有效</div>
<p>本法所称慈善募捐，是指慈善组织基于慈善宗旨募集财产的活动。</p>
<p>慈善募捐，包括面向社会公众的公开募捐和面向特定对象的定向募捐。</p>
