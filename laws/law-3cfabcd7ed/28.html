<h1>中华人民共和国慈善法 第二十八条</h1>
<div class="meta"><a href="../law-3cfabcd7ed.html">《中华人民共和国慈善法》全文</a> · 第三章慈善募捐 · 第28条 · 现行有效</div>
<p>广播、电视、报刊以及网络服务提供者、电信运营商，应当对利用其平台开展公开募捐的慈善组织的登记证书、公开募捐资格证书进行验证。</p>
