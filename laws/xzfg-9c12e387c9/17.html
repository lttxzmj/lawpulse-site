<h1>退耕还林条例 第十七条</h1>
<div class="meta"><a href="../xzfg-9c12e387c9.html">《退耕还林条例》全文</a> · 第二章规划和计划 · 第17条 · 现行有效</div>
<p>退耕还林规划应当与国民经济和社会发展规划、农村经济发展总体规划、土地利用总体规划相衔接，与环境保护、水土保持、防沙治沙等规划相协调。</p>
