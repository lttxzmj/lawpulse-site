<h1>中华人民共和国法律援助法 第三十五条</h1>
<div class="meta"><a href="../legal-aid-law.html">《中华人民共和国法律援助法》全文</a> · 第四章程序和实施 · 第35条 · 现行有效</div>
<p>人民法院、人民检察院、公安机关和有关部门在办理案件或者相关事务中，应当及时告知有关当事人有权依法申请法律援助。</p>
