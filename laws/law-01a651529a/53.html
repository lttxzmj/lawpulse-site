<h1>中华人民共和国人民法院组织法 第五十三条</h1>
<div class="meta"><a href="../law-01a651529a.html">《中华人民共和国人民法院组织法》全文</a> · 第五章人民法院行使职权的保障 · 第53条 · 现行有效</div>
<p>人民法院作出的判决、裁定等生效法律文书，义务人应当依法履行；拒不履行的，依法追究法律责任。</p>
