<h1>军用标准化管理办法 第九条</h1>
<div class="meta"><a href="../xzfg-ae05de8a70.html">《军用标准化管理办法》全文</a> · 第二章标准的制订、修订和审批、发布 · 第9条 · 现行有效</div>
