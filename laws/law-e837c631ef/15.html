<h1>中华人民共和国教师法 第十五条</h1>
<div class="meta"><a href="../law-e837c631ef.html">《中华人民共和国教师法》全文</a> · 第三章资格和任用 · 第15条 · 现行有效</div>
<p>各级师范学校毕业生，应当按照国家有关规定从事教育教学工作。</p>
<p>国家鼓励非师范高等学校毕业生到中小学或者职业学校任教。</p>
