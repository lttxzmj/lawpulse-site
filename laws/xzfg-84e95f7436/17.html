<h1>汶川地震灾后恢复重建条例 第十七条</h1>
<div class="meta"><a href="../xzfg-84e95f7436.html">《汶川地震灾后恢复重建条例》全文</a> · 第二章过渡性安置 · 第17条 · 现行有效</div>
<p>地震灾区的各级人民政府，应当组织受灾群众和企业开展生产自救，积极恢复生产，并做好受灾群众的心理援助工作。</p>
