<h1>饲料和饲料添加剂管理条例 第二十七条</h1>
<div class="meta"><a href="../xzfg-2dbab1e7f0.html">《饲料和饲料添加剂管理条例》全文</a> · 第三章生产、经营和使用 · 第27条 · 现行有效</div>
<p>饲料、饲料添加剂在使用过程中被证实对养殖动物、人体健康或者环境有害的，由国务院农业行政主管部门决定禁用并予以公布。</p>
