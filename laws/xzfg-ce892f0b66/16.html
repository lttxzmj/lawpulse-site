<h1>国务院关于出境入境管理的规定 第十六条</h1>
<div class="meta"><a href="../xzfg-ce892f0b66.html">《国务院关于出境入境管理的规定》全文</a> · 第16条 · 现行有效</div>
<p>移民管理机构应当畅通对违反出境入境管理行为的举报渠道，依法及时处理有关举报。对不属于本单位职责的举报，应当及时移送有关单位依法处理。</p>
