<h1>中华人民共和国陆地国界法 第二十条</h1>
<div class="meta"><a href="../law-0e812f069c.html">《中华人民共和国陆地国界法》全文</a> · 第二章陆地国界的划定和勘定 · 第20条 · 现行有效</div>
<p>国家设置界标在实地标示陆地国界。</p>
<p>界标的位置、种类、规格、材质及设置方式等，由外交部与陆地邻国相关部门协商确定。</p>
