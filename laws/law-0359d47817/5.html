<h1>中华人民共和国人民警察警衔条例 第五条</h1>
<div class="meta"><a href="../law-0359d47817.html">《中华人民共和国人民警察警衔条例》全文</a> · 第一章总则 · 第5条 · 现行有效</div>
<p>警衔高的人民警察对警衔低的人民警察，警衔高的为上级。当警衔高的人民警察在职务上隶属于警衔低的人民警察时，职务高的为上级。</p>
