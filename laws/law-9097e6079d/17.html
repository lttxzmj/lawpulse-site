<h1>中华人民共和国湿地保护法 第十七条</h1>
<div class="meta"><a href="../law-9097e6079d.html">《中华人民共和国湿地保护法》全文</a> · 第二章湿地资源管理 · 第17条 · 现行有效</div>
<p>县级以上人民政府林业草原主管部门建立湿地保护专家咨询机制，为编制湿地保护规划、制定湿地名录、制定相关标准等提供评估论证等服务。</p>
