<h1>中华人民共和国归侨侨眷权益保护法 第二十五条</h1>
<div class="meta"><a href="../law-1e2db1f22a.html">《中华人民共和国归侨侨眷权益保护法》全文</a> · 第25条 · 现行有效</div>
<p>任何组织或者个人侵害归侨、侨眷的合法权益，造成归侨、侨眷财产损失或者其他损害的，依法承担民事责任；构成犯罪的，依法追究刑事责任。</p>
