<h1>中华人民共和国反倾销条例 第十二条</h1>
<div class="meta"><a href="../xzfg-ff7db8c74d.html">《中华人民共和国反倾销条例》全文</a> · 第二章倾销与损害 · 第12条 · 现行有效</div>
<p>同类产品，是指与倾销进口产品相同的产品；没有相同产品的，以与倾销进口产品的特性最相似的产品为同类产品。</p>
