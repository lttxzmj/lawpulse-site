<h1>中华人民共和国妇女权益保障法 第五十八条</h1>
<div class="meta"><a href="../women-rights-protection-law.html">《中华人民共和国妇女权益保障法》全文</a> · 第六章财产权益 · 第58条 · 现行有效</div>
<p>妇女享有与男子平等的继承权。妇女依法行使继承权，不受歧视。</p>
<p>丧偶妇女有权依法处分继承的财产，任何组织和个人不得干涉。</p>
