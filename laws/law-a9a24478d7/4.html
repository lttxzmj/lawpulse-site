<h1>中华人民共和国环境影响评价法 第四条</h1>
<div class="meta"><a href="../law-a9a24478d7.html">《中华人民共和国环境影响评价法》全文</a> · 第一章总则 · 第4条 · 现行有效</div>
<p>环境影响评价必须客观、公开、公正，综合考虑规划或者建设项目实施后对各种环境因素及其所构成的生态系统可能造成的影响，为决策提供科学依据。</p>
