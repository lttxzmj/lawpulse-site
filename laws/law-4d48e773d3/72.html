<h1>中华人民共和国科学技术进步法 第七十二条</h1>
<div class="meta"><a href="../law-4d48e773d3.html">《中华人民共和国科学技术进步法》全文</a> · 第七章区域科技创新 · 第72条 · 现行有效</div>
<p>县级以上地方人民政府应当支持科学技术研究和应用，为促进科技成果转化创造条件，为推动区域创新发展提供良好的创新环境。</p>
