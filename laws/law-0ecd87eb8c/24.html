<h1>中华人民共和国标准化法 第二十四条</h1>
<div class="meta"><a href="../law-0ecd87eb8c.html">《中华人民共和国标准化法》全文</a> · 第二章标准的制定 · 第24条 · 现行有效</div>
<p>标准应当按照编号规则进行编号。标准的编号规则由国务院标准化行政主管部门制定并公布。</p>
