<h1>中华人民共和国合伙企业法 第八十三条</h1>
<div class="meta"><a href="../partnership-enterprise-law.html">《中华人民共和国合伙企业法》全文</a> · 第三章有限合伙企业 · 第83条 · 现行有效</div>
