<h1>个人存款账户实名制规定 第四条</h1>
<div class="meta"><a href="../xzfg-591516d9ae.html">《个人存款账户实名制规定》全文</a> · 第4条 · 现行有效</div>
<p>本规定所称个人存款账户，是指个人在金融机构开立的人民币、外币存款账户，包括活期存款账户、定期存款账户、定活两便存款账户、通知存款账户以及其他形式的个人存款账户。</p>
