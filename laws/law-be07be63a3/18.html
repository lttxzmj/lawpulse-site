<h1>中华人民共和国集会游行示威法 第十八条</h1>
<div class="meta"><a href="../law-be07be63a3.html">《中华人民共和国集会游行示威法》全文</a> · 第三章集会游行示威的举行 · 第18条 · 现行有效</div>
<p>对于依法举行的集会、游行、示威，主管机关应当派出人民警察维持交通秩序和社会秩序，保障集会、游行、示威的顺利进行。</p>
