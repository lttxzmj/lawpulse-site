<h1>中华人民共和国集会游行示威法 第二十一条</h1>
<div class="meta"><a href="../law-be07be63a3.html">《中华人民共和国集会游行示威法》全文</a> · 第三章集会游行示威的举行 · 第21条 · 现行有效</div>
<p>游行在行进中遇有不可预料的情况，不能按照许可的路线行进时，人民警察现场负责人有权改变游行队伍的行进路线。</p>
