<h1>中华人民共和国户口登记条例 第十一条</h1>
<div class="meta"><a href="../law-ad781f06b3.html">《中华人民共和国户口登记条例》全文</a> · 第11条 · 现行有效</div>
<p>被征集服现役的公民，在入伍前，由本人或者户主持应征公民入伍通知书向常住地户口登记机关申报迁出登记，注销户口，不发迁移证件。</p>
