<h1>中华人民共和国渔业法 第十八条</h1>
<div class="meta"><a href="../law-cd3b385dd1.html">《中华人民共和国渔业法》全文</a> · 第二章养殖业 · 第18条 · 现行有效</div>
<p>单位和个人因使用水域、滩涂从事养殖生产发生争议的，依照有关法律规定处理；争议解决前，任何一方不得破坏养殖生产。</p>
