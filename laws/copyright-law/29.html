<h1>中华人民共和国著作权法 第二十九条</h1>
<div class="meta"><a href="../copyright-law.html">《中华人民共和国著作权法》全文</a> · 第三章著作权许可使用和转让合同 · 第29条 · 现行有效</div>
<p>许可使用合同和转让合同中著作权人未明确许可、转让的权利，未经著作权人同意，另一方当事人不得行使。</p>
