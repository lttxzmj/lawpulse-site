<h1>最高人民法院关于审理票据纠纷案件若干问题的规定 第二十四条</h1>
<div class="meta"><a href="../sfjs-8dc7b79ba1.html">《最高人民法院关于审理票据纠纷案件若干问题的规定》全文</a> · 第24条 · 现行有效</div>
<p>出票人已经签章的授权补记的支票丧失后，失票人依法向人民法院申请公示催告的，人民法院应当依法受理。</p>
