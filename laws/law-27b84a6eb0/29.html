<h1>中华人民共和国密码法 第二十九条</h1>
<div class="meta"><a href="../law-27b84a6eb0.html">《中华人民共和国密码法》全文</a> · 第三章商用密码 · 第29条 · 现行有效</div>
<p>国家密码管理部门对采用商用密码技术从事电子政务电子认证服务的机构进行认定，会同有关部门负责政务活动中使用电子签名、数据电文的管理。</p>
