<h1>中华人民共和国电力法 第六十三条</h1>
<div class="meta"><a href="../law-1136583e78.html">《中华人民共和国电力法》全文</a> · 第九章法律责任 · 第63条 · 现行有效</div>
<p>违反本法第二十五条规定，未经许可，从事供电或者变更供电营业区的，由电力管理部门责令改正，没收违法所得，可以并处违法所得五倍以下的罚款。</p>
