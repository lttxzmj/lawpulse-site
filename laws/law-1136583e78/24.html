<h1>中华人民共和国电力法 第二十四条</h1>
<div class="meta"><a href="../law-1136583e78.html">《中华人民共和国电力法》全文</a> · 第四章电力供应与使用 · 第24条 · 现行有效</div>
<p>国家对电力供应和使用，实行安全用电、节约用电、计划用电的管理原则。</p>
<p>电力供应与使用办法由国务院依照本法的规定制定。</p>
