<h1>国家重点建设项目管理办法 第十七条</h1>
<div class="meta"><a href="../xzfg-06411adb38.html">《国家重点建设项目管理办法》全文</a> · 第17条 · 现行有效</div>
<p>建设项目法人应当按照国家有关规定，向国务院计划主管部门报送国家重点建设项目的建设情况和资料，并抄报有关主管部门和银行。</p>
