<h1>国家重点建设项目管理办法 第八条</h1>
<div class="meta"><a href="../xzfg-06411adb38.html">《国家重点建设项目管理办法》全文</a> · 第8条 · 现行有效</div>
<p>根据国家重点建设项目的年度投资计划和合同，负有拨付建设资金责任的国务院有关主管部门、有关地方人民政府、银行和企业事业单位，应当按照项目的建设进度，保证拨付建设资金。</p>
