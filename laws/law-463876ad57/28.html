<h1>中华人民共和国企业所得税法 第二十八条</h1>
<div class="meta"><a href="../law-463876ad57.html">《中华人民共和国企业所得税法》全文</a> · 第四章税收优惠 · 第28条 · 现行有效</div>
<p>符合条件的小型微利企业，减按20％的税率征收企业所得税。</p>
<p>国家需要重点扶持的高新技术企业，减按15％的税率征收企业所得税。</p>
