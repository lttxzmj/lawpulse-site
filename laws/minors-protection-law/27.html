<h1>中华人民共和国未成年人保护法 第二十七条</h1>
<div class="meta"><a href="../minors-protection-law.html">《中华人民共和国未成年人保护法》全文</a> · 第三章学校保护 · 第27条 · 现行有效</div>
<p>学校、幼儿园的教职员工应当尊重未成年人人格尊严，不得对未成年人实施体罚、变相体罚或者其他侮辱人格尊严的行为。</p>
