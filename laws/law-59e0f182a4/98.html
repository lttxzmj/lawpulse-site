<h1>中华人民共和国水污染防治法 第九十八条</h1>
<div class="meta"><a href="../law-59e0f182a4.html">《中华人民共和国水污染防治法》全文</a> · 第七章法律责任 · 第98条 · 现行有效</div>
<p>因水污染引起的损害赔偿诉讼，由排污方就法律规定的免责事由及其行为与损害结果之间不存在因果关系承担举证责任。</p>
