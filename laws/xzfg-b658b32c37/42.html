<h1>突发公共卫生事件应急条例 第四十二条</h1>
<div class="meta"><a href="../xzfg-b658b32c37.html">《突发公共卫生事件应急条例》全文</a> · 第四章应急处理 · 第42条 · 现行有效</div>
<p>有关部门、医疗卫生机构应当对传染病做到早发现、早报告、早隔离、早治疗，切断传播途径，防止扩散。</p>
