<h1>中华人民共和国刑法 第二百三十五条</h1>
<div class="meta"><a href="../criminal-law.html">《中华人民共和国刑法》全文</a> · 第二编分则 · 第四章侵犯公民人身权利、民主权利罪 · 第235条 · 2</div>
