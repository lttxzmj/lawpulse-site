<h1>中华人民共和国刑法 第三十四条</h1>
<div class="meta"><a href="../criminal-law.html">《中华人民共和国刑法》全文</a> · 第一编总则 · 第三章刑罚 · 第一节刑罚的种类 · 第34条 · 2</div>
<p>附加刑的种类如下：</p>
<p>（一）罚金；</p>
<p>（二）剥夺政治权利；</p>
<p>（三）没收财产。</p>
<p>附加刑也可以独立适用。</p>
