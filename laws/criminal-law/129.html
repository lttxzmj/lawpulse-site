<h1>中华人民共和国刑法 第一百二十九条</h1>
<div class="meta"><a href="../criminal-law.html">《中华人民共和国刑法》全文</a> · 第二编分则 · 第二章危害公共安全罪 · 第129条 · 2</div>
<p>依法配备公务用枪的人员，丢失枪支不及时报告，造成严重后果的，处三年以下有期徒刑或者拘役。</p>
