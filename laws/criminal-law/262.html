<h1>中华人民共和国刑法 第二百六十二条</h1>
<div class="meta"><a href="../criminal-law.html">《中华人民共和国刑法》全文</a> · 第二编分则 · 第四章侵犯公民人身权利、民主权利罪 · 第262条 · 2</div>
<p>拐骗不满十四周岁的未成年人，脱离家庭或者监护人的，处五年以下有期徒刑或者拘役。</p>
