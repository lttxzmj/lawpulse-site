<h1>中华人民共和国劳动法 第七十七条</h1>
<div class="meta"><a href="../labor-law.html">《中华人民共和国劳动法》全文</a> · 第十章劳动争议 · 第77条 · 现行有效</div>
<p>用人单位与劳动者发生劳动争议，当事人可以依法申请调解、仲裁、提起诉讼，也可以协商解决。</p>
<p>调解原则适用于仲裁和诉讼程序。</p>
