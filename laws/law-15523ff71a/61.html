<h1>中华人民共和国法官法 第六十一条</h1>
<div class="meta"><a href="../law-15523ff71a.html">《中华人民共和国法官法》全文</a> · 第七章法官的职业保障 · 第61条 · 现行有效</div>
<p>法官因公致残的，享受国家规定的伤残待遇。法官因公牺牲、因公死亡或者病故的，其亲属享受国家规定的抚恤和优待。</p>
