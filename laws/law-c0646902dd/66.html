<h1>中华人民共和国邮政法 第六十六条</h1>
<div class="meta"><a href="../law-c0646902dd.html">《中华人民共和国邮政法》全文</a> · 第七章监督检查 · 第66条 · 现行有效</div>
<p>任何单位和个人对违反本法规定的行为，有权向邮政管理部门举报。邮政管理部门接到举报后，应当及时依法处理。</p>
