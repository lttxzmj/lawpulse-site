<h1>中华人民共和国高等教育法 第四十条</h1>
<div class="meta"><a href="../law-c86388bc91.html">《中华人民共和国高等教育法》全文</a> · 第四章高等学校的组织和活动 · 第40条 · 现行有效</div>
<p>高等学校的校长，由符合教育法规定的任职条件的公民担任。高等学校的校长、副校长按照国家有关规定任免。</p>
