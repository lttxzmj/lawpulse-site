<h1>中华人民共和国高等教育法 第五十九条</h1>
<div class="meta"><a href="../law-c86388bc91.html">《中华人民共和国高等教育法》全文</a> · 第六章高等学校的学生 · 第59条 · 现行有效</div>
<p>高等学校应当为毕业生、结业生提供就业指导和服务。</p>
<p>国家鼓励高等学校毕业生到边远、艰苦地区工作。</p>
