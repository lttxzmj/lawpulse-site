<h1>中华人民共和国档案法 第四十六条</h1>
<div class="meta"><a href="../law-e5c60e88ad.html">《中华人民共和国档案法》全文</a> · 第六章监督检查 · 第46条 · 现行有效</div>
<p>任何单位和个人对档案违法行为，有权向档案主管部门和有关机关举报。</p>
<p>接到举报的档案主管部门或者有关机关应当及时依法处理。</p>
