<h1>中华人民共和国外国籍船舶航行长江水域管理规定 第十八条</h1>
<div class="meta"><a href="../xzfg-ff23bb1248.html">《中华人民共和国外国籍船舶航行长江水域管理规定》全文</a> · 第18条 · 现行有效</div>
<p>船舶在长江水域及其港口期间，不得任意排放和抛弃油类、油性混合物，以及其他污染物质和废弃物。</p>
