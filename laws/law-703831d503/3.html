<h1>中华人民共和国职业病防治法 第三条</h1>
<div class="meta"><a href="../law-703831d503.html">《中华人民共和国职业病防治法》全文</a> · 第一章总则 · 第3条 · 现行有效</div>
<p>职业病防治工作坚持预防为主、防治结合的方针，建立用人单位负责、行政机关监管、行业自律、职工参与和社会监督的机制，实行分类管理、综合治理。</p>
