<h1>中华人民共和国土地管理法 第二十七条</h1>
<div class="meta"><a href="../land-administration-law.html">《中华人民共和国土地管理法》全文</a> · 第三章土地利用总体规划 · 第27条 · 现行有效</div>
<p>县级以上人民政府自然资源主管部门会同同级有关部门根据土地调查成果、规划土地用途和国家制定的统一标准，评定土地等级。</p>
