<h1>中华人民共和国公司法 第二百三十九条</h1>
<div class="meta"><a href="../company-law.html">《中华人民共和国公司法》全文</a> · 第十二章公司解散和清算 · 第239条 · 现行有效</div>
<p>公司清算结束后，清算组应当制作清算报告，报股东会或者人民法院确认，并报送公司登记机关，申请注销公司登记。</p>
