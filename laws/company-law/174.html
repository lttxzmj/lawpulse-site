<h1>中华人民共和国公司法 第一百七十四条</h1>
<div class="meta"><a href="../company-law.html">《中华人民共和国公司法》全文</a> · 第七章国家出资公司组织机构的特别规定 · 第174条 · 现行有效</div>
<p>国有独资公司的经理由董事会聘任或者解聘。</p>
<p>经履行出资人职责的机构同意，董事会成员可以兼任经理。</p>
