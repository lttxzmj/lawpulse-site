<h1>中华人民共和国船员条例 第六十三条</h1>
<div class="meta"><a href="../xzfg-d26d914458.html">《中华人民共和国船员条例》全文</a> · 第八章附则 · 第63条 · 现行有效</div>
<p>引航员的培训依照本条例有关船员培训的规定执行。引航员管理的具体办法由国务院交通主管部门制订。</p>
