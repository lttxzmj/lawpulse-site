<h1>中华人民共和国海洋环境保护法 第七十条</h1>
<div class="meta"><a href="../law-dfa630463b.html">《中华人民共和国海洋环境保护法》全文</a> · 第五章工程建设项目污染防治 · 第70条 · 现行有效</div>
<p>勘探开发海洋油气资源，应当按照有关规定编制油气污染应急预案，报国务院生态环境主管部门海域派出机构备案。</p>
