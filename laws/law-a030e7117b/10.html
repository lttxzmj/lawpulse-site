<h1>中华人民共和国海事诉讼特别程序法 第十条</h1>
<div class="meta"><a href="../law-a030e7117b.html">《中华人民共和国海事诉讼特别程序法》全文</a> · 第二章管辖 · 第10条 · 现行有效</div>
<p>海事法院与地方人民法院之间因管辖权发生争议，由争议双方协商解决；协商解决不了的，报请他们的共同上级人民法院指定管辖。</p>
