<h1>中华人民共和国海事诉讼特别程序法 第一百二十一条</h1>
<div class="meta"><a href="../law-a030e7117b.html">《中华人民共和国海事诉讼特别程序法》全文</a> · 第十一章船舶优先权催告程序 · 第121条 · 现行有效</div>
