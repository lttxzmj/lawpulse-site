<h1>中华人民共和国个人独资企业法 第二十二条</h1>
<div class="meta"><a href="../sole-proprietorship-enterprise-law.html">《中华人民共和国个人独资企业法》全文</a> · 第三章个人独资企业的投资人及事务管理 · 第22条 · 现行有效</div>
<p>个人独资企业招用职工的，应当依法与职工签订劳动合同，保障职工的劳动安全，按时、足额发放职工工资。</p>
