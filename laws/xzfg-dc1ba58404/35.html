<h1>气象灾害防御条例 第三十五条</h1>
<div class="meta"><a href="../xzfg-dc1ba58404.html">《气象灾害防御条例》全文</a> · 第四章应急处置 · 第35条 · 现行有效</div>
<p>县级以上地方人民政府应当根据灾害性天气影响范围、强度，将可能造成人员伤亡或者重大财产损失的区域临时确定为气象灾害危险区，并及时予以公告。</p>
