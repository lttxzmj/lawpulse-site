<h1>中华人民共和国专利法 第五十四条</h1>
<div class="meta"><a href="../patent-law.html">《中华人民共和国专利法》全文</a> · 第六章专利实施的特别许可 · 第54条 · 现行有效</div>
<p>在国家出现紧急状态或者非常情况时，或者为了公共利益的目的，国务院专利行政部门可以给予实施发明专利或者实用新型专利的强制许可。</p>
