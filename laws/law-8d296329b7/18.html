<h1>中华人民共和国反家庭暴力法 第十八条</h1>
<div class="meta"><a href="../law-8d296329b7.html">《中华人民共和国反家庭暴力法》全文</a> · 第三章家庭暴力的处置 · 第18条 · 现行有效</div>
<p>县级或者设区的市级人民政府可以单独或者依托救助管理机构设立临时庇护场所，为家庭暴力受害人提供临时生活帮助。</p>
