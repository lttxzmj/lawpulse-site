<h1>中华人民共和国消防法 第四十一条</h1>
<div class="meta"><a href="../law-29a0fef23a.html">《中华人民共和国消防法》全文</a> · 第三章消防组织 · 第41条 · 现行有效</div>
<p>机关、团体、企业、事业等单位以及村民委员会、居民委员会根据需要，建立志愿消防队等多种形式的消防组织，开展群众性自防自救工作。</p>
