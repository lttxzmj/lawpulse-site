<h1>未成年人网络保护条例 第五条</h1>
<div class="meta"><a href="../xzfg-88edf9219d.html">《未成年人网络保护条例》全文</a> · 第一章总则 · 第5条 · 现行有效</div>
<p>学校、家庭应当教育引导未成年人参加有益身心健康的活动，科学、文明、安全、合理使用网络，预防和干预未成年人沉迷网络。</p>
