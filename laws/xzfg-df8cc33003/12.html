<h1>人体器官捐献和移植条例 第十二条</h1>
<div class="meta"><a href="../xzfg-df8cc33003.html">《人体器官捐献和移植条例》全文</a> · 第二章人体器官的捐献 · 第12条 · 现行有效</div>
<p>国家加强人体器官捐献宣传教育和知识普及，促进形成有利于人体器官捐献的社会风尚。</p>
<p>新闻媒体应当开展人体器官捐献公益宣传。</p>
