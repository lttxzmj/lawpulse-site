<h1>中华人民共和国证券法 第七十条</h1>
<div class="meta"><a href="../securities-law.html">《中华人民共和国证券法》全文</a> · 第四章上市公司的收购 · 第70条 · 现行有效</div>
<p>采取要约收购方式的，收购人在收购期限内，不得卖出被收购公司的股票，也不得采取要约规定以外的形式和超出要约的条件买入被收购公司的股票。</p>
