<h1>中华人民共和国防洪法 第五十二条</h1>
<div class="meta"><a href="../law-89005798e3.html">《中华人民共和国防洪法》全文</a> · 第六章保障措施 · 第52条 · 现行有效</div>
<p>任何单位和个人不得截留、挪用防洪、救灾资金和物资。</p>
<p>各级人民政府审计机关应当加强对防洪、救灾资金使用情况的审计监督。</p>
