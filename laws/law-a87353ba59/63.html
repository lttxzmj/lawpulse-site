<h1>中华人民共和国城乡规划法 第六十三条</h1>
<div class="meta"><a href="../law-a87353ba59.html">《中华人民共和国城乡规划法》全文</a> · 第六章法律责任 · 第63条 · 现行有效</div>
<p>城乡规划编制单位取得资质证书后，不再符合相应的资质条件的，由原发证机关责令限期改正；逾期不改正的，降低资质等级或者吊销资质证书。</p>
