<h1>中华人民共和国城乡规划法 第五条</h1>
<div class="meta"><a href="../law-a87353ba59.html">《中华人民共和国城乡规划法》全文</a> · 第一章总则 · 第5条 · 现行有效</div>
<p>城市总体规划、镇总体规划以及乡规划和村庄规划的编制，应当依据国民经济和社会发展规划，并与土地利用总体规划相衔接。</p>
