<h1>民兵工作条例 第四十一条</h1>
<div class="meta"><a href="../xzfg-b0572fb002.html">《民兵工作条例》全文</a> · 第七章民兵事业费 · 第41条 · 现行有效</div>
<p>民兵事业费的使用和管理实施办法，由省人民政府、省军区制定。</p>
<p>民兵事业费的预算、决算和使用管理，由财政部、总参谋部实施监督，并接受审计机关的审计。</p>
