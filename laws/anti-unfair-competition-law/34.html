<h1>中华人民共和国反不正当竞争法 第三十四条</h1>
<div class="meta"><a href="../anti-unfair-competition-law.html">《中华人民共和国反不正当竞争法》全文</a> · 第四章法律责任 · 第34条 · 现行有效</div>
<p>经营者违反本法规定，应当承担民事责任、行政责任和刑事责任，其财产不足以支付的，优先用于承担民事责任。</p>
