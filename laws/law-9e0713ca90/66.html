<h1>中华人民共和国反恐怖主义法 第六十六条</h1>
<div class="meta"><a href="../law-9e0713ca90.html">《中华人民共和国反恐怖主义法》全文</a> · 第六章应对处置 · 第66条 · 现行有效</div>
<p>公安机关应当及时对恐怖事件立案侦查，查明事件发生的原因、经过和结果，依法追究恐怖活动组织、人员的刑事责任。</p>
