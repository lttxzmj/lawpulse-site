<h1>中华人民共和国反恐怖主义法 第四十九条</h1>
<div class="meta"><a href="../law-9e0713ca90.html">《中华人民共和国反恐怖主义法》全文</a> · 第五章调查 · 第49条 · 现行有效</div>
