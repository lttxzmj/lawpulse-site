<h1>著作权集体管理条例 第二十条</h1>
<div class="meta"><a href="../xzfg-054e7ab5b7.html">《著作权集体管理条例》全文</a> · 第四章著作权集体管理活动 · 第20条 · 现行有效</div>
<p>权利人与著作权集体管理组织订立著作权集体管理合同后，不得在合同约定期限内自己行使或者许可他人行使合同约定的由著作权集体管理组织行使的权利。</p>
