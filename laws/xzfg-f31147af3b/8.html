<h1>企业信息公示暂行条例 第八条</h1>
<div class="meta"><a href="../xzfg-f31147af3b.html">《企业信息公示暂行条例》全文</a> · 第8条 · 现行有效</div>
<p>企业应当于每年1月1日至6月30日，通过国家企业信用信息公示系统向市场监督管理部门报送上一年度年度报告，并向社会公示。</p>
<p>当年设立登记的企业，自下一年起报送并公示年度报告。</p>
