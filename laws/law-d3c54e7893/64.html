<h1>中华人民共和国节约能源法 第六十四条</h1>
<div class="meta"><a href="../law-d3c54e7893.html">《中华人民共和国节约能源法》全文</a> · 第五章激励措施 · 第64条 · 现行有效</div>
<p>政府采购监督管理部门会同有关部门制定节能产品、设备政府采购名录，应当优先列入取得节能产品认证证书的产品、设备。</p>
