<h1>无障碍环境建设条例 第十七条</h1>
<div class="meta"><a href="../xzfg-6d48a2f5a1.html">《无障碍环境建设条例》全文</a> · 第二章无障碍设施建设 · 第17条 · 现行有效</div>
<p>无障碍设施的所有权人和管理人，应当对无障碍设施进行保护，有损毁或者故障及时进行维修，确保无障碍设施正常使用。</p>
