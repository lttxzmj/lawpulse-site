<h1>最高人民法院关于适用《中华人民共和国民法典》继承编的解释（一） 第二十六条</h1>
<div class="meta"><a href="../sfjs-mfd-jicheng.html">《最高人民法院关于适用《中华人民共和国民法典》继承编的解释（一）》全文</a> · 第26条 · 现行有效</div>
<p>遗嘱人以遗嘱处分了国家、集体或者他人财产的，应当认定该部分遗嘱无效。</p>
