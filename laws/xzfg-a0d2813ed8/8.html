<h1>印铸刻字业暂行管理规则 第八条</h1>
<div class="meta"><a href="../xzfg-a0d2813ed8.html">《印铸刻字业暂行管理规则》全文</a> · 第8条 · 现行有效</div>
<p>凡遵照本规则各条规定进行报告、检举，因而查获重大罪犯、破获重大案件者，由公安局酌情予以名誉或物质奖励。</p>
