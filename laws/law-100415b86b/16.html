<h1>中华人民共和国旅游法 第十六条</h1>
<div class="meta"><a href="../law-100415b86b.html">《中华人民共和国旅游法》全文</a> · 第二章旅游者 · 第16条 · 现行有效</div>
<p>出境旅游者不得在境外非法滞留，随团出境的旅游者不得擅自分团、脱团。</p>
<p>入境旅游者不得在境内非法滞留，随团入境的旅游者不得擅自分团、脱团。</p>
