<h1>中华人民共和国价格法 第三十一条</h1>
<div class="meta"><a href="../law-380deebce1.html">《中华人民共和国价格法》全文</a> · 第四章价格总水平调控 · 第31条 · 现行有效</div>
<p>当市场价格总水平出现剧烈波动等异常状态时，国务院可以在全国范围内或者部分区域内采取临时集中定价权限、部分或者全面冻结价格的紧急措施。</p>
