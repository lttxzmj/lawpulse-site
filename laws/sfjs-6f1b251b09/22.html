<h1>人民法院在线诉讼规则 第二十二条</h1>
<div class="meta"><a href="../sfjs-6f1b251b09.html">《人民法院在线诉讼规则》全文</a> · 第22条 · 现行有效</div>
<p>适用在线庭审的案件，应当按照法律和司法解释的相关规定开展庭前准备、法庭调查、法庭辩论等庭审活动，保障当事人申请回避、举证、质证、陈述、辩论等诉讼权利。</p>
