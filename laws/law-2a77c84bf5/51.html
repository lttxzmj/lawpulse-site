<h1>中华人民共和国种子法 第五十一条</h1>
<div class="meta"><a href="../law-2a77c84bf5.html">《中华人民共和国种子法》全文</a> · 第六章种子监督管理 · 第51条 · 现行有效</div>
<p>种子生产经营者可自愿向具有资质的认证机构申请种子质量认证。经认证合格的，可以在包装上使用认证标识。</p>
