<h1>中华人民共和国电子商务法 第四条</h1>
<div class="meta"><a href="../e-commerce-law.html">《中华人民共和国电子商务法》全文</a> · 第一章总则 · 第4条 · 现行有效</div>
<p>国家平等对待线上线下商务活动，促进线上线下融合发展，各级人民政府和有关部门不得采取歧视性的政策措施，不得滥用行政权力排除、限制市场竞争。</p>
